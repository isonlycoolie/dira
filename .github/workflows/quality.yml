name: Code Quality and Security

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit safety

      - name: Run bandit security scan
        run: bandit -r apps libs -ll -i
        continue-on-error: true

      - name: Check for known vulnerabilities with safety
        run: safety check --json
        continue-on-error: true

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install hatch ruff pylint pytest pytest-cov

      - name: Format check with ruff
        run: python -m ruff format --check .
        continue-on-error: true

      - name: Lint with ruff
        run: python -m ruff check .

      - name: Run pylint on critical modules
        run: python -m pylint apps/pipeline/src/transforms/ --disable=all --enable=E,F
        continue-on-error: true

      - name: Check test coverage
        run: python -m pytest --cov=apps --cov=libs --cov-report=term-missing:skip-covered
        continue-on-error: true
