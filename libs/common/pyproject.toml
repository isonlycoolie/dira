[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "dira-common"
version = "0.1.0"
description = "Cross-cutting utilities for DIRA."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.7",
  "structlog",
  "prometheus-client",
  "pandas",
  "tenacity",
  "kafka-python",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dira_common"]
